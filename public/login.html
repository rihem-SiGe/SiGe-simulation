<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Plateforme SiGe</title>
    <style>
        body { background: #e3f2fd; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #0052cc; margin-bottom: 25px; font-weight: 800; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { background: #0052cc; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Plateforme SiGe</h2>
        <input type="email" id="email" placeholder="Email (prof@univ.dz)">
        <input type="password" id="pw" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
    </div>
    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pw').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('userEmail', email);
                    window.location.href = 'index.html';
                } else {
                    alert(data.message);
                }
            } catch (err) { alert("Erreur: Le serveur est éteint !"); }
        }
    </script>
</body>
</html>
